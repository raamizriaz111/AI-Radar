<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="beam" x1="16" y1="16" x2="28" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" stroke="#1E293B" stroke-width="1" />

  <!-- Outer radar boundary ring -->
  <circle cx="16" cy="16" r="11" stroke="url(#ring)" stroke-width="1.25" stroke-opacity="0.35" />
  
  <!-- Mid radar ring -->
  <circle cx="16" cy="16" r="7" stroke="url(#ring)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2" />

  <!-- Radar sweep line -->
  <line x1="16" y1="16" x2="26" y2="8" stroke="url(#beam)" stroke-width="2" stroke-linecap="round" />

  <!-- Target blip / verified signal -->
  <circle cx="21" cy="11" r="1.75" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Center core emitter -->
  <circle cx="16" cy="16" r="2.25" fill="#3B82F6" />
  <circle cx="16" cy="16" r="1" fill="#FFFFFF" />
</svg>
